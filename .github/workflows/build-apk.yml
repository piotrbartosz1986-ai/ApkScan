name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - good320-auth-transport-only

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw GOOD320 + jeden bridge Accessis
        run: |
          sed -i 's#/ApkScan/main/web/#/ApkScan/good320-auth-transport-only/web/#g' app/src/main/java/com/bricolab/scannerbridge/MainActivity.java
          sed -i 's/versionCode 9/versionCode 122/' app/build.gradle
          sed -i 's/versionName "2.7-bridge"/versionName "3.3.22-good320-accessis-single-bridge"/' app/build.gradle

          # Usuń dwa stare bridge'e BricoUpload. Zostaje wyłącznie
          # BricoAuthApplication.UploadBridge używający sesji Accessis.
          sed -i '/webView.addJavascriptInterface(new NativeUploadBridge(), "BricoUpload");/d' \
            app/src/main/java/com/bricolab/scannerbridge/MainActivity.java
          sed -i '/uploadWebView.addJavascriptInterface(new BricoUploadBridge(), "BricoUpload");/d' \
            app/src/main/java/com/bricolab/scannerbridge/MainActivityV25.java

          if grep -R 'addJavascriptInterface(new NativeUploadBridge(), "BricoUpload")' app/src/main/java/com/bricolab/scannerbridge/MainActivity.java; then
            echo 'Stary NativeUploadBridge nadal rejestruje BricoUpload' >&2
            exit 1
          fi
          if grep -R 'addJavascriptInterface(new BricoUploadBridge(), "BricoUpload")' app/src/main/java/com/bricolab/scannerbridge/MainActivityV25.java; then
            echo 'Stary V25 BricoUploadBridge nadal rejestruje BricoUpload' >&2
            exit 1
          fi

      - name: Sprawdź backend PHP v3
        run: php -l server/scanner_product_lookup_v3.php

      - name: Obsłuż GS1 Code128 z prefiksem ]C1
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/bricolab/scannerbridge/ScannerEngine.java')
          text = path.read_text(encoding='utf-8')

          needle = '        if (value.isEmpty()) return null;\n\n        for (int i = 0; i < value.length(); i++) {'
          replacement = '        if (value.isEmpty()) return null;\n\n        if ("CODE_128".equals(sourceFormat) && value.startsWith("]C1")) {\n            value = value.substring(3);\n        }\n\n        for (int i = 0; i < value.length(); i++) {'
          if needle not in text:
              raise SystemExit('Nie znaleziono miejsca normalizacji GS1')
          text = text.replace(needle, replacement, 1)

          source_line = '                    boolean sourceIsRealEan = "EAN_13".equals(sourceFormat) || "EAN_8".equals(sourceFormat);'
          gs1_lines = source_line + '\n                    boolean sourceIsGs1Code128 = "CODE_128".equals(sourceFormat) &&\n                            raw.startsWith("]C1") && code.length() == 13;'
          if source_line not in text:
              raise SystemExit('Nie znaleziono sourceIsRealEan')
          text = text.replace(source_line, gs1_lines, 1)

          old_if = '                    if (sourceIsRealEan && config.validateEanChecksum && !isValidEan(code, productFormat)) {'
          new_if = '                    if ((sourceIsRealEan || sourceIsGs1Code128) &&\n                            config.validateEanChecksum && !isValidEan(code, productFormat)) {'
          if old_if not in text:
              raise SystemExit('Nie znaleziono warunku checksum')
          text = text.replace(old_if, new_if, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Ustaw 6 kolejnych odczytów
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/bricolab/scannerbridge/ScannerConfig.java')
          text = path.read_text(encoding='utf-8')

          old_default = '    public int validConfirmReads = 3;'
          old_forced = '            config.validConfirmReads = 3;'
          if old_default not in text:
              raise SystemExit('Nie znaleziono domyślnego validConfirmReads=3')
          if old_forced not in text:
              raise SystemExit('Nie znaleziono wymuszonego validConfirmReads=3')

          text = text.replace(old_default, '    public int validConfirmReads = 6;', 1)
          text = text.replace(old_forced, '            config.validConfirmReads = 6;', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Przygotuj stały klucz DEV
        run: |
          base64 -d signing/brico-dev.keystore.b64 > signing/brico-dev.keystore

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: BricoScanner-GOOD320-ACCESSIS-SINGLE-BRIDGE-3.3.22
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
