name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Przygotuj stały klucz DEV
        run: |
          base64 -d signing/brico-dev.keystore.b64 > signing/brico-dev.keystore

      - name: Ustaw wersję V2.2
        run: |
          sed -i 's/versionCode 3/versionCode 4/' app/build.gradle
          sed -i 's/versionName "2.1-bridge"/versionName "2.2-bridge"/' app/build.gradle

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: BricoScanner-V2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
