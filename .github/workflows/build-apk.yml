name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic-d-old-camera-overlay-controls

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw web testu D i numer APK
        run: |
          sed -i 's#/ApkScan/main/web/#/ApkScan/diagnostic-d-old-camera-overlay-controls/web/#g' app/src/main/java/com/bricolab/scannerbridge/MainActivity.java
          sed -i 's/versionCode 9/versionCode 93/' app/build.gradle
          sed -i 's/versionName "2.7-bridge"/versionName "diag-D-old-camera-overlay"/' app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Przygotuj stały klucz DEV
        run: |
          base64 -d signing/brico-dev.keystore.b64 > signing/brico-dev.keystore

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: BricoScanner-DIAG-D-old-camera-start-torch-zoom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
