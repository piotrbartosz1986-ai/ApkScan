name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic-d-old-camera-native-controls

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw web i numer APK
        run: |
          sed -i 's#/ApkScan/main/web/#/ApkScan/diagnostic-d-old-camera-native-controls/web/#g' app/src/main/java/com/bricolab/scannerbridge/MainActivity.java
          sed -i 's/versionCode 9/versionCode 107/' app/build.gradle
          sed -i 's/versionName "2.7-bridge"/versionName "3.3.8-gs1-code128"/' app/build.gradle

      - name: Obsłuż GS1 Code128 z prefiksem ]C1
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/bricolab/scannerbridge/ScannerEngine.java')
          text = path.read_text(encoding='utf-8')

          old_normalize = '''        String value = raw.trim();
          if (value.isEmpty()) return null;

          for (int i = 0; i < value.length(); i++) {
              if (!Character.isDigit(value.charAt(i))) return null;
          }

          if ("EAN_13".equals(sourceFormat)) return value.length() == 13 ? value : null;
          if ("EAN_8".equals(sourceFormat)) return value.length() == 8 ? value : null;

          // Ustalona zasada dla cenówek z systemu: CODE_128 ma być traktowany jak
          // produkt tylko wtedy, gdy zawiera dokładnie 13 cyfr. Bez dopisywania zer.
          if ("CODE_128".equals(sourceFormat)) return value.length() == 13 ? value : null;'''

          new_normalize = '''        String value = raw.trim();
          if (value.isEmpty()) return null;

          // ML Kit dla GS1-128 może zwrócić identyfikator AIM "]C1" przed właściwymi
          // danymi. Nie jest on częścią EAN-u produktu, więc zdejmujemy go dopiero
          // po RAW diagnostyce, przed walidacją wejścia do listy.
          if ("CODE_128".equals(sourceFormat) && value.startsWith("]C1")) {
              value = value.substring(3);
          }

          for (int i = 0; i < value.length(); i++) {
              if (!Character.isDigit(value.charAt(i))) return null;
          }

          if ("EAN_13".equals(sourceFormat)) return value.length() == 13 ? value : null;
          if ("EAN_8".equals(sourceFormat)) return value.length() == 8 ? value : null;

          // CODE_128 / GS1-128 trafia do listy produktów tylko wtedy, gdy po usunięciu
          // opcjonalnego prefiksu ]C1 pozostaje dokładnie 13 cyfr.
          if ("CODE_128".equals(sourceFormat)) return value.length() == 13 ? value : null;'''

          old_checksum = '''                    String productFormat = code.length() == 8 ? "EAN_8" : "EAN_13";
          boolean sourceIsRealEan = "EAN_13".equals(sourceFormat) || "EAN_8".equals(sourceFormat);

          // Cenówki systemowe są często CODE_128 z 13 cyframi. To identyfikator
          // produktu, ale nie wolno odrzucać go tylko dlatego, że źródłowa
          // symbologia nie jest EAN. Checksum EAN sprawdzamy wyłącznie dla
          // kodów faktycznie odczytanych przez ML Kit jako EAN_13 / EAN_8.
          if (sourceIsRealEan && config.validateEanChecksum && !isValidEan(code, productFormat)) {'''

          new_checksum = '''                    String productFormat = code.length() == 8 ? "EAN_8" : "EAN_13";
          boolean sourceIsRealEan = "EAN_13".equals(sourceFormat) || "EAN_8".equals(sourceFormat);
          boolean sourceIsGs1Code128 = "CODE_128".equals(sourceFormat) &&
                  raw.startsWith("]C1") && code.length() == 13;

          // EAN-y oraz GS1-128 zapisany przez ML Kit jako ]C1 + 13 cyfr przechodzą
          // tę samą kontrolę cyfry kontrolnej EAN przed zasadą 3 kolejnych odczytów.
          if ((sourceIsRealEan || sourceIsGs1Code128) &&
                  config.validateEanChecksum && !isValidEan(code, productFormat)) {'''

          if old_normalize not in text:
              raise SystemExit('Nie znaleziono bloku normalizeProductCode do podmiany')
          if old_checksum not in text:
              raise SystemExit('Nie znaleziono bloku checksum do podmiany')

          text = text.replace(old_normalize, new_normalize, 1)
          text = text.replace(old_checksum, new_checksum, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Przygotuj stały klucz DEV
        run: |
          base64 -d signing/brico-dev.keystore.b64 > signing/brico-dev.keystore

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: BricoScanner-V3.3.8-gs1-code128-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
