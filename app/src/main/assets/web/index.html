<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Brico Scanner Offline</title>
<style>
body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,sans-serif;padding:16px}.panel{background:#14181d;border:1px solid #29313a;border-radius:16px;padding:14px;margin-bottom:10px}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#36d27f;color:#07140d;font-weight:900;margin-bottom:8px}.dark{background:#1a2026;color:#f5f7fa;border:1px solid #29313a}.code{font:900 22px/1.2 monospace;word-break:break-all;text-align:center}.muted{color:#9aa5b1;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{margin-top:10px}.item{padding:9px;border-top:1px solid #29313a;font-family:monospace}.switch{display:flex;align-items:center;gap:8px}.switch input{width:20px;height:20px}
</style>
</head>
<body>
<div class="panel"><b>Brico Scanner Bridge V2.2</b><div class="muted">Tryb awaryjny offline — zdalny interfejs nie był dostępny.</div></div>
<div class="row"><button id="start">WŁĄCZ SKANER</button><button class="dark" id="focus">FOCUS</button></div>
<div class="panel"><div class="muted">OSTATNI KOD</div><div class="code" id="code">—</div><div class="muted" id="meta">Brak skanów</div></div>
<div class="row"><button class="dark" id="torch">LATARKA</button><button class="dark" id="preview">POKAŻ KAMERĘ</button></div>
<div class="panel"><label class="switch"><input id="volume" type="checkbox"> VOL+/VOL− = SKAN</label></div>
<div class="panel"><div class="muted" id="state">Gotowy</div><div class="list" id="list"></div></div>
<script>
(function(){var N=window.NativeScanner||null,state={running:false,torch:false},preview=false,list=[];function p(v){try{return typeof v==='string'?JSON.parse(v):v||{}}catch(e){return {}}}window.onNativeScannerState=function(v){state=p(v);document.getElementById('start').textContent=state.running?'WYŁĄCZ SKANER':'WŁĄCZ SKANER';document.getElementById('state').textContent='AF: '+(state.focus||'—')+' • '+(state.event||'gotowy')};window.onNativeBarcode=function(v){var x=p(v);document.getElementById('code').textContent=x.code||'—';document.getElementById('meta').textContent=(x.format||'BARCODE')+' • '+new Date(x.timestamp||Date.now()).toLocaleTimeString('pl-PL');list.unshift(x);document.getElementById('list').innerHTML=list.slice(0,30).map(function(i){return '<div class="item">'+i.code+'</div>'}).join('')};window.onNativeHardwareScanButton=function(){if(!N)return;if(!state.running){N.startScanner();return}if(state.paused){N.setPaused(false);return}N.focus()};document.getElementById('start').onclick=function(){if(!N)return;state.running?N.stopScanner():N.startScanner()};document.getElementById('focus').onclick=function(){if(N)N.focus()};document.getElementById('torch').onclick=function(){if(N){N.setTorch(!state.torch)}};document.getElementById('preview').onclick=function(){preview=!preview;if(N)N.setPreviewVisible(preview)};document.getElementById('volume').onchange=function(){if(N&&typeof N.setVolumeButtonsEnabled==='function')N.setVolumeButtonsEnabled(this.checked)};if(N){window.onNativeScannerState(N.getState());if(typeof N.getVolumeButtonsEnabled==='function')document.getElementById('volume').checked=!!N.getVolumeButtonsEnabled()}})();
</script>
</body>
</html>
