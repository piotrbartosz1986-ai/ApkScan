<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Skaner</title>
<style>html,body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{padding:24px;font-weight:800}</style>
</head>
<body>
<div class="loading" id="loading">Ładowanie Skanera…</div>
<script>
(function(){
  var stamp=Date.now();
  var mainBase='https://raw.githubusercontent.com/piotrbartosz1986-ai/ApkScan/main/web/';

  function mainText(name,required){
    return fetch(mainBase+name+'?_='+stamp,{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.text()})
      .catch(function(e){if(required)throw e;return ''});
  }

  function localText(name,required){
    return fetch(name+'?_='+stamp,{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.text()})
      .catch(function(e){if(required)throw e;return ''});
  }

  Promise.all([
    mainText('index-v24.html',true),
    localText('upload-extension-v38.js',true),
    mainText('product-data-extension.js',false),
    mainText('scanner-v32-extension.js',false),
    mainText('scanner-v33-ui-extension.js',false),
    localText('scanner-v37-theme-extension.js',true),
    localText('scanner-v38-list-extension.js',true),
    localText('scanner-v39-upload-endpoint-migration.js',true),
    localText('scanner-v40-compact-list-extension.js',true)
  ]).then(function(parts){
    var html=parts[0];
    var extensions=parts.slice(1).filter(Boolean).map(function(code){
      return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>';
    }).join('\n');

    if(html.indexOf('</body>')>=0) html=html.replace('</body>',extensions+'\n</body>');
    else html+=extensions;

    document.open();
    document.write(html);
    document.close();
  }).catch(function(err){
    document.getElementById('loading').textContent='Błąd ładowania interfejsu: '+err.message;
  });
})();
</script>
</body>
</html>
