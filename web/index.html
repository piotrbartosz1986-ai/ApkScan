<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Skaner</title>
<style>html,body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{padding:24px;font-weight:800}</style>
</head>
<body>
<div class="loading" id="loading">Ładowanie Skanera — test D…</div>
<script>
(function(){
  var stamp=Date.now();
  var base='https://raw.githubusercontent.com/piotrbartosz1986-ai/ApkScan/main/web/';

  function text(name,required){
    return fetch(base+name+'?_='+stamp,{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.text()})
      .catch(function(e){if(required)throw e;return ''});
  }

  Promise.all([
    text('index-v24.html',true),
    text('upload-extension.js',true),
    text('product-data-extension.js',false),
    text('scanner-v32-extension.js',false),
    text('scanner-v33-ui-extension.js',false)
  ]).then(function(parts){
    var html=parts[0];

    var noContext="(function(){function hide(){var ids=['setContextPreview','setContextFromZoom','setDigitalZoom'];ids.forEach(function(id){var el=document.getElementById(id);if(!el)return;var row=el.closest('.check')||el.closest('.field')||el.parentElement;if(row)row.style.display='none'});var old=document.getElementById('cameraStartCompatBarV35');if(old)old.remove()}function boot(){setTimeout(hide,20);setTimeout(hide,180);setTimeout(hide,700)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();document.addEventListener('click',function(e){if(e.target&&e.target.id==='settingsBtn')setTimeout(hide,40)},true)})();";

    var extensions=[parts[1],parts[2],parts[3],parts[4],noContext]
      .filter(Boolean)
      .map(function(code){return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>'})
      .join('\n');

    if(html.indexOf('</body>')>=0)html=html.replace('</body>',extensions+'\n</body>');
    else html+=extensions;

    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('loading').textContent='Błąd ładowania testu D: '+err.message;
  });
})();
</script>
</body>
</html>
