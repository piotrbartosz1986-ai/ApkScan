<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Brico Scanner</title>
<style>html,body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{padding:24px;font-weight:800}</style>
</head>
<body>
<div class="loading" id="loading">Ładowanie Brico Scanner 3.2…</div>
<script>
(function(){
  var stamp=Date.now();
  Promise.all([
    fetch('index-v24.html?_='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('UI '+r.status);return r.text()}),
    fetch('upload-extension.js?_='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('UPLOAD '+r.status);return r.text()}),
    fetch('product-data-extension.js?_='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('PRODUCT '+r.status);return r.text()}).catch(function(){return ''}),
    fetch('scanner-v32-extension.js?_='+stamp,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('V32 '+r.status);return r.text()}).catch(function(){return ''})
  ]).then(function(parts){
    var html=parts[0];
    var extensions=[parts[1],parts[2],parts[3]].filter(Boolean).map(function(code){return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>'}).join('\n');
    if(html.indexOf('</body>')>=0)html=html.replace('</body>',extensions+'\n</body>');
    else html+=extensions;
    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('loading').textContent='Błąd ładowania interfejsu: '+err.message;
  });
})();
</script>
</body>
</html>
