<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Skaner</title>
<style>html,body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{padding:24px;font-weight:800}</style>
</head>
<body>
<div class="loading" id="loading">Ładowanie Skanera…</div>
<script>
(function(){
  var stamp=Date.now();
  var repo='https://raw.githubusercontent.com/piotrbartosz1986-ai/ApkScan/';
  var GOOD320=repo+'9be77d85f249481f8f2c6098c79fa55e408c0b43/web/';
  var AUTHBASE=repo+'93ac4861dd30de618e61779177ef34af857e84e9/web/';
  var THIS=repo+'bricolab-scan-separate/web/';

  function text(base,name,required){
    return fetch(base+name+'?_='+stamp,{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.text()})
      .catch(function(e){if(required)throw e;return ''});
  }

  Promise.all([
    text(AUTHBASE,'index-v24.html',true),
    text(THIS,'upload-extension-v38.js',true),
    text(AUTHBASE,'scanner-v32-extension.js',false),
    text(AUTHBASE,'scanner-v33-ui-extension.js',false),
    text(GOOD320,'scanner-v37-theme-extension.js',true),
    text(GOOD320,'scanner-v38-list-extension.js',true),
    text(GOOD320,'scanner-v39-upload-endpoint-migration.js',true),
    text(GOOD320,'scanner-v40-compact-list-extension.js',true),
    text(GOOD320,'scanner-v41-list-refresh-extension.js',true),
    text(GOOD320,'scanner-v42-name-size-extension.js',true),
    text(GOOD320,'scanner-v45-native-format-sync-extension.js',true),
    text(GOOD320,'scanner-v46-raw-mlkit-history-extension.js',true),
    text(GOOD320,'scanner-v47-manual-code-extension.js',true),
    text(GOOD320,'scanner-v48-converters-extension.js',true),
    text(GOOD320,'scanner-v49-converters-units.js',true),
    text(GOOD320,'scanner-v50-converters-product-ui.js',true),
    text(GOOD320,'scanner-v51-converters-send.js',true),
    text(GOOD320,'scanner-v52-converters-mode-ui.js',true),
    text(GOOD320,'scanner-v53-converters-status.js',true),
    text(THIS,'scanner-v55-converters-actions-fix.js',true),
    text(THIS,'scanner-v56-converters-metadata.js',true),
    text(THIS,'accessis-compat-v60.js',true),
    text(THIS,'database-status-accessis-v61.js',true),
    text(THIS,'database-stamp-svg-v66.js',true),
    text(THIS,'product-row-accessis-v62.js',true)
  ]).then(function(parts){
    var html=parts[0];
    html=html.replace('version:8,','version:10,');
    var extensions=parts.slice(1).filter(Boolean).map(function(code){
      return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>';
    }).join('\n');
    if(html.indexOf('</body>')>=0)html=html.replace('</body>',extensions+'\n<script>window.__BRICO_GOOD320_ACCESSIS_V62=true;<\/script>\n</body>');
    else html+=extensions+'\n<script>window.__BRICO_GOOD320_ACCESSIS_V62=true;<\/script>';
    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('loading').textContent='Błąd ładowania interfejsu: '+err.message;
  });
})();
</script>
</body>
</html>
